name: Build WAZEN iOS Ad Hoc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Require signing configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          WAZEN_BUNDLE_ID: ${{ vars.WAZEN_BUNDLE_ID }}
          WAZEN_API_BASE_URL: ${{ vars.WAZEN_API_BASE_URL }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          names = ['APPLE_TEAM_ID', 'IOS_CERTIFICATE_P12_BASE64', 'IOS_CERTIFICATE_PASSWORD',
                   'IOS_PROVISIONING_PROFILE_BASE64', 'WAZEN_BUNDLE_ID', 'WAZEN_API_BASE_URL']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing configuration names: ' + ', '.join(missing))
          url = urlparse(os.environ['WAZEN_API_BASE_URL'])
          if url.scheme != 'https' or not url.netloc or url.username or url.password:
              raise SystemExit('WAZEN_API_BASE_URL must be an HTTPS URL without credentials')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native iOS project
        working-directory: mobile
        run: |
          flutter config --no-enable-swift-package-manager
          flutter create --platforms=ios --project-name=wazen_mobile --org=ae.wazen .
      - name: Test Flutter
        working-directory: mobile
        run: flutter test
      - name: Import signing identity and build IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          WAZEN_BUNDLE_ID: ${{ vars.WAZEN_BUNDLE_ID }}
          WAZEN_API_BASE_URL: ${{ vars.WAZEN_API_BASE_URL }}
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/wazen-signing"
          mkdir -m 700 "$SIGNING_DIR"
          export SIGNING_DIR
          KEYCHAIN_PATH="$SIGNING_DIR/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/wazen-ci.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/wazen-ci.mobileprovision"
            rm -rf "$SIGNING_DIR"
          }
          trap cleanup EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['SIGNING_DIR'])
          for name, filename in [('IOS_CERTIFICATE_P12_BASE64', 'cert.p12'),
                                 ('IOS_PROVISIONING_PROFILE_BASE64', 'profile.mobileprovision')]:
              (root / filename).write_bytes(base64.b64decode(os.environ[name]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$SIGNING_DIR/profile.mobileprovision" > "$SIGNING_DIR/profile.plist"
          python3 - <<'PY'
          import os, plistlib, subprocess
          from datetime import datetime
          from pathlib import Path
          root = Path(os.environ['SIGNING_DIR'])
          with (root / 'profile.plist').open('rb') as source:
              profile = plistlib.load(source)
          team = os.environ['APPLE_TEAM_ID']
          bundle = os.environ['WAZEN_BUNDLE_ID']
          entitlement = profile['Entitlements']
          app_id = entitlement.get('application-identifier', '')
          if team not in profile.get('TeamIdentifier', []) or app_id != team + '.' + bundle:
              raise SystemExit('Provisioning profile does not match configured team/bundle')
          if not profile.get('ProvisionedDevices') or entitlement.get('get-task-allow'):
              raise SystemExit('An Ad Hoc distribution profile with registered devices is required')
          if profile['ExpirationDate'] <= datetime.utcnow():
              raise SystemExit('Provisioning profile has expired')
          subprocess.run(['python3', 'scripts/prepare_ios.py', '--bundle-id', bundle,
                          '--team-id', team, '--profile-uuid', profile['UUID']], check=True)
          with (root / 'ExportOptions.plist').open('wb') as target:
              plistlib.dump({'method': 'ad-hoc', 'teamID': team, 'signingStyle': 'manual',
                            'signingCertificate': 'Apple Distribution',
                            'provisioningProfiles': {bundle: profile['UUID']},
                            'destination': 'export'}, target)
          PY
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$SIGNING_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/wazen-ci.mobileprovision"
          cp "$SIGNING_DIR/profile.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/wazen-ci.mobileprovision"
          cd mobile
          flutter build ipa --release --build-number="$GITHUB_RUN_NUMBER" --export-options-plist="$SIGNING_DIR/ExportOptions.plist" --dart-define="API_BASE_URL=$WAZEN_API_BASE_URL"
          test -n "$(find build/ios/ipa -name '*.ipa' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: WAZEN-iOS-AdHoc-${{ github.run_number }}
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
