name: Deploy WAZEN PWA

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/web-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter web platform
        working-directory: mobile
        run: flutter create --platforms=web .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build web
        working-directory: mobile
        run: >
          flutter build web --release
          --base-href /wazen-app/
          --dart-define=API_BASE_URL=https://wazen-api-production-ee44.up.railway.app/api/v1

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
