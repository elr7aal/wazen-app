name: Validate WAZEN Flutter

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/web-dist/**'
      - '.github/workflows/web-pwa.yml'
  workflow_dispatch:

concurrency:
  group: wazen-flutter-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter web platform
        working-directory: mobile
        run: |
          flutter create --platforms=web .
          python3 prepare_web.py

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run WAZEN Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Validate web build
        working-directory: mobile
        run: >
          flutter build web --release
          --dart-define=API_BASE_URL=https://wazen-api-production-ee44.up.railway.app/api/v1
