name: Build WAZEN Web

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/web-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter web platform
        working-directory: mobile
        run: flutter create --platforms=web .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build web
        working-directory: mobile
        run: >
          flutter build web --release
          --dart-define=API_BASE_URL=https://wazen-api-production-ee44.up.railway.app/api/v1

      - name: Save built web app in repository
        run: |
          rm -rf mobile/web-dist
          mkdir -p mobile/web-dist
          cp -a mobile/build/web/. mobile/web-dist/
          git config user.name "WAZEN Web Builder"
          git config user.email "actions@github.com"
          git add -f mobile/web-dist
          git commit -m "chore: publish WAZEN web build [skip ci]" || exit 0
          git push
