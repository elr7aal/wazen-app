name: Validate WAZEN iOS

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/web-dist/**'
      - 'scripts/prepare_ios.py'
      - '.github/workflows/ios-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wazen-ios-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native iOS project
        working-directory: mobile
        run: |
          flutter config --no-enable-swift-package-manager
          flutter create --platforms=ios --project-name=wazen_mobile --org=ae.wazen .
      - name: Configure WAZEN permissions and Keychain
        run: python3 scripts/prepare_ios.py
      - name: Test Flutter
        working-directory: mobile
        run: flutter test
      - name: Build unsigned iOS release
        working-directory: mobile
        env:
          API_BASE_URL: ${{ vars.WAZEN_API_BASE_URL || 'https://wazen-api-production-ee44.up.railway.app/api/v1' }}
        run: flutter build ios --release --no-codesign --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Preserve native project and build for review
        run: |
          mkdir -p ios-review
          ditto -c -k --sequesterRsrc --keepParent mobile/build/ios/iphoneos/Runner.app ios-review/WAZEN-unsigned.app.zip
          cp -R mobile/ios ios-review/ios
          rm -rf ios-review/ios/Pods ios-review/ios/.symlinks
          cp mobile/pubspec.lock ios-review/pubspec.lock
          printf '%s\n' 'Unsigned validation build. Cannot be installed on iPhone without Apple signing. No deployment performed.' > ios-review/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WAZEN-iOS-unsigned-${{ github.sha }}
          path: ios-review
          retention-days: 7
