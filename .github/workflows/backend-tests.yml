name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
          WAZEN_SECRET: test-secret
          WAZEN_ADMIN_KEY: test-admin-key
        run: pytest -q

  docker-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t wazen-backend-ci ./backend

      - name: Start backend container
        run: |
          docker run -d --name wazen-backend-ci -p 8000:8000 \
            -e WAZEN_ENV=development \
            -e JWT_SECRET=ci-only-secret-value-with-more-than-32-characters \
            -e WAZEN_ADMIN_KEY=ci-admin-key \
            wazen-backend-ci

      - name: Wait for migrated API health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/readiness > /tmp/wazen-readiness.json; then
              cat /tmp/wazen-readiness.json
              exit 0
            fi
            sleep 2
          done
          docker logs wazen-backend-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs wazen-backend-ci || true

      - name: Stop backend container
        if: always()
        run: docker rm -f wazen-backend-ci || true


  postgres-backup-restore:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create isolated PostgreSQL network
        run: docker network create wazen-backup-ci

      - name: Start PostgreSQL
        run: |
          docker run -d --name wazen-postgres-ci --network wazen-backup-ci             -e POSTGRES_USER=wazen             -e POSTGRES_PASSWORD=wazen-ci-password             -e POSTGRES_DB=wazen_source             postgres:17-alpine

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec wazen-postgres-ci pg_isready -U wazen -d wazen_source >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs wazen-postgres-ci
          exit 1

      - name: Build WAZEN backend image
        run: docker build -t wazen-backend-backup-ci ./backend

      - name: Start source WAZEN against PostgreSQL
        run: |
          docker run -d --name wazen-source-app --network wazen-backup-ci -p 8011:8000             -e WAZEN_ENV=development             -e DATABASE_URL=postgresql+psycopg://wazen:wazen-ci-password@wazen-postgres-ci:5432/wazen_source             -e JWT_SECRET=ci-only-secret-value-with-more-than-32-characters             -e WAZEN_ADMIN_KEY=ci-admin-key             wazen-backend-backup-ci

      - name: Verify source readiness and capture counts
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8011/api/v1/readiness > /tmp/source-readiness.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/source-readiness.json
          grep -q '"ready":true' /tmp/source-readiness.json
          docker exec wazen-postgres-ci psql -U wazen -d wazen_source -tAc "SELECT count(*) FROM food_items;" > /tmp/source-food-count.txt
          test "$(tr -d '[:space:]' < /tmp/source-food-count.txt)" -gt 0
          docker exec wazen-postgres-ci psql -U wazen -d wazen_source -tAc "SELECT version_num FROM alembic_version;" > /tmp/source-migration.txt

      - name: Create PostgreSQL backup
        run: |
          docker exec wazen-postgres-ci pg_dump -U wazen -d wazen_source -Fc -f /tmp/wazen.dump
          test "$(docker exec wazen-postgres-ci sh -c 'stat -c %s /tmp/wazen.dump')" -gt 0

      - name: Restore backup into clean database
        run: |
          docker exec wazen-postgres-ci createdb -U wazen wazen_restore
          docker exec wazen-postgres-ci pg_restore -U wazen -d wazen_restore --exit-on-error /tmp/wazen.dump

      - name: Verify restored schema and data
        run: |
          docker exec wazen-postgres-ci psql -U wazen -d wazen_restore -tAc "SELECT count(*) FROM food_items;" > /tmp/restore-food-count.txt
          docker exec wazen-postgres-ci psql -U wazen -d wazen_restore -tAc "SELECT version_num FROM alembic_version;" > /tmp/restore-migration.txt
          test "$(tr -d '[:space:]' < /tmp/source-food-count.txt)" = "$(tr -d '[:space:]' < /tmp/restore-food-count.txt)"
          test "$(tr -d '[:space:]' < /tmp/source-migration.txt)" = "$(tr -d '[:space:]' < /tmp/restore-migration.txt)"

      - name: Start WAZEN from restored database
        run: |
          docker run -d --name wazen-restored-app --network wazen-backup-ci -p 8012:8000             -e WAZEN_ENV=development             -e DATABASE_URL=postgresql+psycopg://wazen:wazen-ci-password@wazen-postgres-ci:5432/wazen_restore             -e JWT_SECRET=ci-only-secret-value-with-more-than-32-characters             -e WAZEN_ADMIN_KEY=ci-admin-key             wazen-backend-backup-ci

      - name: Verify restored application readiness
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8012/api/v1/readiness > /tmp/restore-readiness.json; then
              cat /tmp/restore-readiness.json
              grep -q '"ready":true' /tmp/restore-readiness.json
              exit 0
            fi
            sleep 2
          done
          docker logs wazen-restored-app
          exit 1

      - name: Show backup drill logs on failure
        if: failure()
        run: |
          docker logs wazen-source-app || true
          docker logs wazen-restored-app || true
          docker logs wazen-postgres-ci || true

      - name: Cleanup backup drill
        if: always()
        run: |
          docker rm -f wazen-source-app wazen-restored-app wazen-postgres-ci || true
          docker network rm wazen-backup-ci || true
