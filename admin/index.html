<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WAZEN Admin</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f7f6;color:#18211b}
header{padding:20px 24px;background:#173f2a;color:#fff} main{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid #e5e8e5;border-radius:16px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1;min-width:220px}
input,select,textarea,button{font:inherit;border-radius:10px;border:1px solid #ccd3cd;padding:10px}
button{cursor:pointer;background:#173f2a;color:#fff;border:0}.secondary{background:#eef2ef;color:#173f2a}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;vertical-align:top}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ef}.muted{color:#66736a;font-size:13px}
pre{white-space:pre-wrap;direction:ltr;text-align:left;background:#0e1510;color:#d9f5e1;padding:12px;border-radius:10px;overflow:auto}
</style>
</head>
<body>
<header><h1 style="margin:0">WAZEN Admin</h1><div>مراجعة البيانات، الجودة، الاستيراد، التعديل والدمج — v53</div></header>
<main>
<section class="card">
  <div class="row">
    <input id="api" class="grow" placeholder="API Base URL" value="http://127.0.0.1:8000/api/v1"/>
    <input id="key" class="grow" type="password" placeholder="X-WAZEN-ADMIN-KEY"/>
    <input id="actor" placeholder="اسم المراجع" value="admin"/>
    <button onclick="saveSettings()">حفظ الإعدادات</button>
  </div>
</section>

<section class="card">
  <h2>مراجعة الأطعمة</h2>
  <div class="row">
    <input id="q" class="grow" placeholder="ابحث باسم الطعام أو المطعم"/>
    <select id="status"><option value="">كل الحالات</option><option>PENDING</option><option>APPROVE</option><option>REJECT</option><option>FLAG</option></select>
    <button onclick="loadFoods()">بحث</button>
  </div>
  <div style="overflow:auto;margin-top:12px"><table><thead><tr><th>الطعام</th><th>المصدر</th><th>التغذية</th><th>المراجعة</th><th>إجراء</th></tr></thead><tbody id="foods"></tbody></table></div>
</section>


<section class="card">
  <div class="row"><h2 class="grow">جودة وحداثة البيانات</h2><button onclick="loadQuality()">تحديث التقرير</button></div>
  <div id="qualitySummary" class="row muted">لم يتم تحميل التقرير بعد.</div>
  <div style="overflow:auto;margin-top:12px">
    <table>
      <thead><tr><th>الطعام</th><th>المصدر</th><th>الحداثة</th><th>المشاكل</th></tr></thead>
      <tbody id="qualityIssues"></tbody>
    </table>
  </div>
</section>

<section class="card">
  <h2>استيراد بيانات</h2>
  <div class="row">
    <select id="format"><option>JSON</option><option>CSV</option></select>
    <label><input id="dry" type="checkbox" checked/> Dry run</label>
  </div>
  <textarea id="payload" style="width:100%;box-sizing:border-box;margin-top:10px;min-height:180px" placeholder='JSON array أو CSV text'></textarea>
  <div class="row" style="margin-top:10px"><button onclick="runImport()">تشغيل الاستيراد</button><button class="secondary" onclick="sample()">مثال</button></div>
  <pre id="importResult">لم يتم تشغيل استيراد بعد.</pre>
</section>

<section class="card">
  <div class="row"><h2 class="grow">Audit history</h2><button onclick="loadAudit()">تحديث</button></div>
  <pre id="audit">لم يتم التحميل بعد.</pre>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function saveSettings(){localStorage.setItem('wazen_api',$('api').value);localStorage.setItem('wazen_key',$('key').value);localStorage.setItem('wazen_actor',$('actor').value)}
function restore(){ $('api').value=localStorage.getItem('wazen_api')||$('api').value;$('key').value=localStorage.getItem('wazen_key')||'';$('actor').value=localStorage.getItem('wazen_actor')||'admin'}
function headers(){return {'Content-Type':'application/json','X-WAZEN-ADMIN-KEY':$('key').value,'X-WAZEN-ADMIN-ACTOR':$('actor').value}}
async function api(path,opt={}){saveSettings();const r=await fetch($('api').value.replace(/\/$/,'')+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));return j.data}
async function loadFoods(){
 try{const p=new URLSearchParams();if($('q').value)p.set('q',$('q').value);if($('status').value)p.set('review_status',$('status').value);const d=await api('/admin/foods?'+p);$('foods').innerHTML=d.items.map(x=>`<tr><td><b>${x.name_ar||x.name_en||x.id}</b><div class="muted">${x.id}</div></td><td>${x.vendor_name||x.brand_name||'-'}</td><td>${x.nutrition.calories??'-'} kcal<br>${x.nutrition.protein_g??'-'}g protein</td><td><span class="badge">${x.review.review_status}</span><div class="muted">${x.review.note||''}</div></td><td><button onclick="review('${x.id}','APPROVE')">اعتماد</button> <button class="secondary" onclick="review('${x.id}','FLAG')">Flag</button> <button class="secondary" onclick="review('${x.id}','REJECT')">رفض</button> <button class="secondary" onclick="editFood('${x.id}')">تعديل</button> <button class="secondary" onclick="mergeFood('${x.id}')">دمج</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد نتائج</td></tr>'}catch(e){alert(e.message)}
}
async function review(id,action){const note=prompt('ملاحظة المراجع (اختياري)')||null;try{await api('/admin/foods/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({action,note})});loadFoods()}catch(e){alert(e.message)}}
async function editFood(id){
  try{
    const rows=await api('/admin/foods?q='+encodeURIComponent(id));
    const item=(rows.items||[]).find(x=>x.id===id);
    if(!item){alert('تعذر العثور على السجل');return;}
    const payload={
      name_en:item.name_en,
      name_ar:item.name_ar,
      vendor_name:item.vendor_name,
      brand_name:item.brand_name,
      category:item.category,
      barcode:item.barcode,
      nutrition:item.nutrition
    };
    const raw=prompt('عدّل JSON ثم اضغط OK',JSON.stringify(payload,null,2));
    if(!raw)return;
    const changes=JSON.parse(raw);
    await api('/admin/foods/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({changes})});
    await loadFoods();await loadAudit();
  }catch(e){alert(e.message)}
}
async function mergeFood(sourceId){
  const targetId=prompt('أدخل ID السجل الأساسي الذي تريد الدمج إليه');
  if(!targetId||targetId===sourceId)return;
  if(!confirm('سيتم نقل المراجع من '+sourceId+' إلى '+targetId+' وسيصبح المصدر MERGED. متابعة؟'))return;
  try{
    await api('/admin/foods/merge',{method:'POST',body:JSON.stringify({source_id:sourceId,target_id:targetId})});
    await loadFoods();await loadAudit();
  }catch(e){alert(e.message)}
}
function sample(){if($('format').value==='JSON')$('payload').value=JSON.stringify([{id:'LOCAL-001',name_ar:'مجبوس دجاج',name_en:'Chicken Machboos',food_type:'LOCAL',category:'RICE',calories:520,protein_g:32,carbs_g:61,fat_g:16,sodium_mg:780}],null,2);else $('payload').value='id,name_en,name_ar,food_type,calories,protein_g\nLOCAL-001,Chicken Machboos,مجبوس دجاج,LOCAL,520,32\n'}
async function runImport(){try{const format=$('format').value;const body={format,dry_run:$('dry').checked};if(format==='JSON')body.records=JSON.parse($('payload').value||'[]');else body.csv_text=$('payload').value;const d=await api('/admin/import/foods',{method:'POST',body:JSON.stringify(body)});$('importResult').textContent=JSON.stringify(d,null,2)}catch(e){$('importResult').textContent=e.message}}

async function loadQuality(){
  try{
    const d=await api('/admin/data-quality?limit=200');
    const s=d.summary||{};
    $('qualitySummary').innerHTML=[
      'إجمالي: '+(s.active_foods??0),
      'Fresh: '+(s.fresh??0),
      'Aging: '+(s.aging??0),
      'Stale: '+(s.stale??0),
      'بدون تحقق: '+(s.unknown_verification??0),
      'بدون مصدر: '+(s.missing_source??0),
      'نقص تغذية أساسية: '+(s.missing_core_nutrition??0),
      'نقص صوديوم: '+(s.missing_sodium??0),
      'إجمالي السجلات ذات المشاكل: '+(d.issue_count??0)
    ].map(x=>'<span class="badge">'+x+'</span>').join(' ');
    $('qualityIssues').innerHTML=(d.issues||[]).map(x=>`<tr>
      <td><b>${x.name||x.food_id}</b><div class="muted">${x.food_id}</div></td>
      <td>${x.source_name||'—'}<div class="muted">${x.source_confidence||'—'}</div></td>
      <td><span class="badge">${x.source_freshness||'UNKNOWN'}</span><div class="muted">${x.source_age_days==null?'—':x.source_age_days+' يوم'}</div></td>
      <td>${(x.flags||[]).map(f=>'<span class="badge">'+f+'</span>').join(' ')}</td>
    </tr>`).join('')||'<tr><td colspan="4">لا توجد مشاكل ضمن النتائج المعروضة</td></tr>';
  }catch(e){
    $('qualitySummary').textContent=e.message;
  }
}

async function loadAudit(){try{$('audit').textContent=JSON.stringify(await api('/admin/audit?limit=100'),null,2)}catch(e){$('audit').textContent=e.message}}
restore();
</script>
</body>
</html>
